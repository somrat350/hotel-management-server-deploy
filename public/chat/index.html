<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Chat Test Interface</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="/chat/css/style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-header">
          <h2>💬 Chat Test</h2>
          <div class="connection-status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Disconnected</span>
          </div>
        </div>

        <div class="config-section">
          <h3>🔧 Configuration</h3>
          <div class="form-group">
            <label>Server URL</label>
            <input type="text" id="serverUrl" value="http://localhost:3000" />
          </div>
          <div class="form-group">
            <label>JWT Token (optional)</label>
            <input
              type="text"
              id="jwtToken"
              placeholder="Token optional for dev mode"
            />
          </div>
          <button
            class="btn btn-primary"
            id="connectBtn"
            onclick="toggleConnection()"
          >
            Connect
          </button>
        </div>

        <div class="config-section">
          <h3>📋 Conversations</h3>
          <div class="form-group">
            <label>Conversation ID</label>
            <input
              type="text"
              id="conversationId"
              placeholder="Enter conversation ID"
            />
          </div>
          <button
            class="btn btn-secondary"
            id="joinBtn"
            onclick="joinConversation()"
            disabled
          >
            Join Conversation
          </button>
        </div>

        <div class="conversations-list" id="conversationsList">
          <!-- Conversations will be loaded here -->
        </div>
      </div>

      <!-- Chat Area -->
      <div class="chat-area">
        <div class="chat-header">
          <div class="chat-header-info">
            <h3 id="chatTitle">Select a Conversation</h3>
            <p id="chatSubtitle">Connect to start chatting</p>
          </div>
          <div class="chat-header-actions">
            <button
              class="icon-btn"
              onclick="leaveConversation()"
              title="Leave Conversation"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"
                />
              </svg>
            </button>
            <button
              class="icon-btn"
              onclick="loadMessages()"
              title="Refresh Messages"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="messages-container" id="messagesContainer">
          <div class="welcome-screen">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path
                d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
              />
            </svg>
            <h3>Welcome to Chat Test</h3>
            <p>
              Connect to the server and join a conversation to start testing
            </p>
          </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
          <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <span>Someone is typing...</span>
        </div>

        <div class="input-area">
          <div class="input-wrapper">
            <input
              type="text"
              class="message-input"
              id="messageInput"
              placeholder="Type a message..."
              onkeypress="handleKeyPress(event)"
              disabled
            />
            <button
              class="send-btn"
              id="sendBtn"
              onclick="sendMessage()"
              disabled
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
              </svg>
            </button>
          </div>
        </div>

        <div class="logs-section" id="logsSection">
          <h4>📜 Event Logs</h4>
          <div id="logsContainer"></div>
        </div>
      </div>
    </div>

    <script src="/chat/js/app.js"></script>
  </body>
</html>
